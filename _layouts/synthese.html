---
layout: default
---
<article class="synthese">
  <p class="blog-date">{{ page.date | date: "%-d %B %Y" }}</p>
  {% if page.venue %}<p class="blog-venue">{{ page.venue }}</p>{% endif %}
  {% if page.summary %}<p class="synthese-summary">{{ page.summary }}</p>{% endif %}

  <div class="synthese-body">
    {{ content }}
  </div>

  <p class="synthese-back"><a href="{{ '/blog/' | relative_url }}">Retour au blog</a></p>
</article>
