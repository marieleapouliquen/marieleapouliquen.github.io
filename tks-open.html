<!-- ============================================================= -->
<!--  TERRA KLIMA · Coquille diaporama réutilisable (ouverture)     -->
<!--  Usage dans une page .md (voir _pages/poly-*.md pour un exemple  -->
<!--  complet) : appeler l'include tks-open.html avec title, subtitle -->
<!--  et badge, écrire une suite de <section class="tks-slide" …>,     -->
<!--  puis appeler l'include tks-close.html.                          -->
<!--  La table des matières (barre latérale), le compteur et la      -->
<!--  barre de progression sont générés AUTOMATIQUEMENT à partir des -->
<!--  <section class="tks-slide"> présentes : ajouter ou retirer une -->
<!--  slide met tout à jour, sans rien d'autre à modifier.          -->
<!-- ============================================================= -->
<script>
  window.MathJax = window.MathJax || {
    tex:{ inlineMath:[['$','$'],['\\(','\\)']], displayMath:[['$$','$$'],['\\[','\\]']] },
    svg:{ fontCache:'global' }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  .tks{
    --navy:#1B2C3A; --deep:#12202B; --lightnavy:#2E4A5C;
    --teal:#3E7686; --sky:#4E8A9C; --amber:#D2842F;
    --sand:#F6FAFB; --line:#DCE7EB; --ink:#1E293B; --muted:#64748B;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--ink); margin:1.5rem 0 0; border:1px solid var(--line);
    border-radius:16px; overflow:hidden; background:#fff;
    box-shadow:0 1px 3px rgba(16,42,60,.06);
  }
  .tks *{box-sizing:border-box;}
  .tks:fullscreen{border-radius:0;margin:0;overflow:auto;background:#F1F5F9;}

  /* Barre de marque */
  .tks-bar{background:var(--navy);color:#fff;display:flex;align-items:center;
    justify-content:space-between;padding:.7rem 1rem;gap:1rem;}
  .tks-brand{display:flex;align-items:center;gap:.6rem;min-width:0;}
  .tks-logo{width:34px;height:34px;border-radius:50%;background:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);}
  .tks-logo img{width:100%;height:100%;object-fit:contain;transform:scale(1.3);}
  .tks-logo span{font-weight:800;color:var(--navy);font-size:.8rem;letter-spacing:-.02em;}
  .tks-titles{min-width:0;}
  .tks-titles .t{font-weight:700;font-size:1rem;line-height:1.15;}
  .tks-titles .s{font-size:.72rem;color:#B9CDD6;line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tks-badge{background:rgba(210,132,47,.18);color:#EBC594;border:1px solid rgba(210,132,47,.4);
    font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:.15rem .5rem;border-radius:5px;white-space:nowrap;}
  .tks-modes{display:flex;background:var(--deep);border:1px solid #33505f;border-radius:9px;padding:3px;flex:0 0 auto;}
  .tks-modes button{background:none;border:0;color:#B9CDD6;font-family:inherit;font-size:.75rem;
    font-weight:600;padding:.35rem .7rem;border-radius:6px;cursor:pointer;transition:all .15s;}
  .tks-modes button.on{background:var(--teal);color:#fff;}

  /* Corps : barre latérale + scène */
  .tks-body{display:flex;align-items:stretch;}
  .tks-side{width:250px;flex:0 0 auto;border-right:1px solid var(--line);background:var(--sand);
    max-height:78vh;overflow-y:auto;}
  .tks-side-h{padding:.8rem 1rem;font-size:.68rem;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line);}
  #tks-nav{padding:.6rem;}
  .tks-nav-lesson{margin-bottom:.5rem;}
  .tks-nav-lesson>.h{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.82rem;
    color:var(--navy);padding:.35rem .3rem;}
  .tks-nav-lesson>.h .n{width:20px;height:20px;border-radius:5px;font-size:.7rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .tks-nav-sub{padding-left:1.75rem;}
  .tks-nav-sub a{display:block;font-size:.76rem;color:#475569;text-decoration:none;
    padding:.28rem .3rem;border-radius:5px;cursor:pointer;line-height:1.3;}
  .tks-nav-sub a:hover{background:#fff;color:var(--teal);}
  .tks-nav-sub a.on{background:var(--navy);color:#fff;font-weight:600;}
  .c-sky{background:#DCEAEE;color:#345F6C;} .c-emerald{background:#D1FAE5;color:#047857;}
  .c-amber{background:#F5E1C8;color:#975B21;} .c-rose{background:#FFE4E6;color:#9F1239;}

  .tks-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:#F1F5F9;}
  .tks-controls{display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:.7rem 1rem;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .tks-controls .grp{display:flex;align-items:center;gap:.5rem;}
  .tks-btn{font-family:inherit;font-size:.75rem;font-weight:600;border-radius:8px;padding:.45rem .7rem;
    border:0;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem;transition:all .15s;}
  .tks-btn.g{background:#EEF2F5;color:var(--navy);} .tks-btn.g:hover{background:var(--navy);color:#fff;}
  .tks-btn.p{background:var(--navy);color:#fff;} .tks-btn.p:hover{background:var(--lightnavy);}
  .tks-btn.i{background:none;color:var(--muted);padding:.45rem .5rem;} .tks-btn.i:hover{color:var(--navy);}
  .tks-count{font-size:.75rem;color:var(--muted);font-weight:600;}
  .tks-count b{color:var(--navy);}
  .tks-prog{width:120px;height:7px;background:#E2E8F0;border-radius:99px;overflow:hidden;border:1px solid #d5dee4;}
  .tks-prog>i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s;}

  .tks-slides{padding:1.1rem;}
  .tks-slide{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:1.4rem 1.5rem;box-shadow:0 1px 2px rgba(16,42,60,.05);}
  .tks-slide.on{display:block;animation:tksIn .25s ease;}
  .tks.docmode .tks-slide{display:block;margin-bottom:1.1rem;}
  .tks.docmode .tks-controls{display:none;}
  @keyframes tksIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

  /* Éléments de contenu de slide */
  .tks-slide .eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--teal);margin:0 0 .25rem;}
  .tks-slide h2{font-family:'EB Garamond',Georgia,serif;font-size:1.55rem;font-weight:600;
    color:var(--navy);margin:0 0 .9rem;line-height:1.2;}
  .tks-slide h3{font-family:'EB Garamond',Georgia,serif;font-size:1.05rem;color:var(--navy);
    margin:1.1rem 0 .4rem;}
  .tks-slide p{font-size:.95rem;line-height:1.65;color:#334155;margin:0 0 .8rem;}
  .tks-slide ul,.tks-slide ol{font-size:.93rem;line-height:1.6;color:#334155;margin:0 0 .8rem;padding-left:1.2rem;}
  .tks-slide li{margin-bottom:.35rem;}
  .tks-slide strong{color:var(--navy);}
  .tks-slide a{color:var(--teal);}
  .tks-cols{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;}
  .tks-cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
  .tks-card{background:var(--sand);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;}
  .tks-card p{margin:0;font-size:.9rem;}
  .tks-note{background:var(--sand);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;
    padding:.9rem 1.1rem;margin:1rem 0;}
  .tks-note p{margin:0;font-size:.92rem;color:var(--ink);}
  .tks-slide blockquote{border-left:3px solid var(--sky);background:var(--sand);
    padding:.8rem 1.1rem;margin:1rem 0;font-style:italic;color:#334155;border-radius:0 8px 8px 0;}
  .tks-slide blockquote p{margin:0 0 .5rem;}
  .tks-def{border:1px solid var(--teal);background:#EEF4F6;padding:.9rem 1.1rem;
    margin:1rem 0;border-radius:8px;}
  .tks-def p{margin:0;font-size:.93rem;}
  .tks-def strong,.tks-slide blockquote strong{color:var(--navy);}
  .an{font-weight:700;color:var(--amber);}
  .c-violet{background:#EDE9FE;color:#6D28D9;} .c-cyan{background:#CFFAFE;color:#0E7490;}
  figure.tks-fig{margin:1rem 0;text-align:center;}
  figure.tks-fig img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;
    background:#fff;cursor:zoom-in;}
  figure.tks-fig figcaption{font-size:.8rem;color:var(--muted);font-style:italic;margin-top:.4rem;}
  .tks-formula{background:var(--deep);color:#EAF2F5;border-radius:8px;padding:.9rem 1.1rem;
    margin:1rem 0;text-align:center;font-size:1.02rem;overflow-x:auto;}

  /* Slide de titre */
  .tks-cover{background:linear-gradient(135deg,var(--navy),var(--lightnavy),var(--deep));
    color:#fff;border-radius:12px;padding:2rem;margin:-.2rem 0 .5rem;}
  .tks-cover .eyebrow{color:#EBC594;}
  .tks-cover h2{color:#fff;font-size:2rem;}
  .tks-cover p{color:#CFE0E7;}

  /* Lightbox */
  .tks-lightbox{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.82);padding:2rem;cursor:zoom-out;}
  .tks-lightbox.on{display:flex;}
  .tks-lightbox img{max-width:94vw;max-height:82vh;object-fit:contain;border-radius:10px;background:#fff;}
  .tks-lightbox figcaption{color:#e5e7eb;font-size:.85rem;font-style:italic;text-align:center;
    margin-top:.8rem;max-width:48rem;}

  @media(max-width:820px){
    .tks-side{display:none;}
    .tks-cols,.tks-cols-3{grid-template-columns:1fr;}
    .tks-titles .s{display:none;}
  }
</style>

<div class="tks" id="{{ include.id | default: 'tks-app' }}">
  <div class="tks-bar">
    <div class="tks-brand">
      <div class="tks-logo"><img src="{{ '/assets/img/poly/logo.png' | relative_url }}" alt="Terra Klima" onerror="this.style.display='none';this.parentNode.innerHTML='<span>TK</span>'"></div>
      <div class="tks-titles">
        <div class="t">{{ include.title }}</div>
        <div class="s">{{ include.subtitle }}</div>
      </div>
      {% if include.badge %}<span class="tks-badge">{{ include.badge }}</span>{% endif %}
    </div>
    <div class="tks-modes">
      <button type="button" class="on" data-mode="slides">Diaporama</button>
      <button type="button" data-mode="doc">Document</button>
    </div>
  </div>

  <div class="tks-body">
    <aside class="tks-side">
      <div class="tks-side-h">Programme</div>
      <nav id="tks-nav"></nav>
    </aside>
    <div class="tks-main">
      <div class="tks-controls">
        <div class="grp">
          <button type="button" class="tks-btn g" data-nav="prev">← Précédent</button>
          <button type="button" class="tks-btn p" data-nav="next">Suivant →</button>
        </div>
        <div class="grp">
          <span class="tks-count">Slide <b data-cur>1</b> / <span data-total>1</span></span>
          <div class="tks-prog"><i></i></div>
          <button type="button" class="tks-btn i" data-nav="full" title="Plein écran">⤢</button>
        </div>
      </div>
      <div class="tks-slides" id="tks-slides">
