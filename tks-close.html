      </div><!-- /.tks-slides -->
    </div><!-- /.tks-main -->
  </div><!-- /.tks-body -->

  <div class="tks-lightbox" id="{{ include.id | default: 'tks-app' }}-lb">
    <figure style="margin:0;display:flex;flex-direction:column;align-items:center;">
      <img src="" alt="">
      <figcaption></figcaption>
    </figure>
  </div>
</div><!-- /.tks -->

<script>
(function(){
  var app = document.getElementById('{{ include.id | default: "tks-app" }}');
  if(!app) return;
  var slides = Array.prototype.slice.call(app.querySelectorAll('.tks-slide'));
  var navEl  = app.querySelector('#tks-nav') || app.querySelector('.tks-side nav');
  var curEl  = app.querySelector('[data-cur]');
  var totEl  = app.querySelector('[data-total]');
  var progEl = app.querySelector('.tks-prog > i');
  var lb     = document.getElementById('{{ include.id | default: "tks-app" }}-lb');
  var current = 0, mode = 'slides';
  var colors = {sky:'c-sky',emerald:'c-emerald',amber:'c-amber',rose:'c-rose'};

  // --- Table des matières générée automatiquement à partir des slides ---
  var lessons = [], byKey = {};
  slides.forEach(function(s, i){
    var lnum = s.getAttribute('data-lesson') || '';
    var ltit = s.getAttribute('data-lesson-title') || '';
    var col  = s.getAttribute('data-color') || 'sky';
    var stit = s.getAttribute('data-title') || ('Slide ' + (i+1));
    var key = lnum + '§' + ltit;
    if(!byKey[key]){ byKey[key] = {num:lnum, title:ltit, color:col, items:[]}; lessons.push(byKey[key]); }
    byKey[key].items.push({idx:i, title:stit});
  });
  lessons.forEach(function(L){
    var block = document.createElement('div'); block.className = 'tks-nav-lesson';
    var h = '';
    if(L.title){
      h += '<div class="h">';
      if(L.num){ h += '<span class="n '+(colors[L.color]||'c-sky')+'">'+L.num+'</span>'; }
      h += '<span>'+L.title+'</span></div>';
    }
    h += '<div class="tks-nav-sub">';
    L.items.forEach(function(it){
      h += '<a data-go="'+it.idx+'">'+it.title+'</a>';
    });
    h += '</div>';
    block.innerHTML = h;
    navEl.appendChild(block);
  });
  var navLinks = Array.prototype.slice.call(navEl.querySelectorAll('a[data-go]'));

  if(totEl) totEl.textContent = slides.length;

  function render(){
    if(mode === 'slides'){
      slides.forEach(function(s,i){ s.classList.toggle('on', i === current); });
      if(curEl) curEl.textContent = current + 1;
      if(progEl) progEl.style.width = ((current+1)/slides.length*100) + '%';
      navLinks.forEach(function(a){ a.classList.toggle('on', +a.getAttribute('data-go') === current); });
      if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise([app]); }
    }
  }
  function go(i){ current = Math.max(0, Math.min(slides.length-1, i));
    if(mode === 'doc'){ setMode('slides'); }
    render();
    var y = app.getBoundingClientRect().top + window.pageYOffset - 12;
    window.scrollTo({top:y, behavior:'smooth'});
  }
  function setMode(m){
    mode = m; app.classList.toggle('docmode', m === 'doc');
    app.querySelectorAll('.tks-modes button').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-mode') === m);
    });
    if(m === 'doc'){ slides.forEach(function(s){ s.classList.remove('on'); }); }
    else { render(); }
  }

  app.querySelector('[data-nav="prev"]').addEventListener('click', function(){ go(current-1); });
  app.querySelector('[data-nav="next"]').addEventListener('click', function(){ go(current+1); });
  app.querySelector('[data-nav="full"]').addEventListener('click', function(){
    if(!document.fullscreenElement){ app.requestFullscreen && app.requestFullscreen(); }
    else { document.exitFullscreen && document.exitFullscreen(); }
  });
  app.querySelectorAll('.tks-modes button').forEach(function(b){
    b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); });
  });
  navLinks.forEach(function(a){ a.addEventListener('click', function(){ go(+a.getAttribute('data-go')); }); });
  app.addEventListener('keydown', function(e){
    if(mode !== 'slides') return;
    if(e.key === 'ArrowRight'){ go(current+1); }
    else if(e.key === 'ArrowLeft'){ go(current-1); }
  });
  app.setAttribute('tabindex','0');

  // --- Lightbox ---
  if(lb){
    var lbImg = lb.querySelector('img'), lbCap = lb.querySelector('figcaption');
    app.querySelectorAll('.tks-slide figure img').forEach(function(img){
      img.addEventListener('click', function(){
        lbImg.src = img.currentSrc || img.src; lbImg.alt = img.alt || '';
        var fig = img.closest('figure'), cap = fig ? fig.querySelector('figcaption') : null;
        lbCap.textContent = cap ? cap.textContent : (img.alt || '');
        lb.classList.add('on');
      });
    });
    lb.addEventListener('click', function(){ lb.classList.remove('on'); lbImg.src=''; });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ lb.classList.remove('on'); } });
  }

  render();
})();
</script>
